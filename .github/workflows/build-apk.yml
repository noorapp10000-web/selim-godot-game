name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK (Godot 4.3)
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Restore game assets if needed
        run: |
          if [ ! -d "assets" ] || [ -z "$(ls -A assets 2>/dev/null)" ]; then
            echo "Assets directory is missing or empty, downloading v10.0.0 assets package..."
            wget -q -L https://github.com/noorapp10000-web/selim-godot-game/releases/download/v10.0.0/selim_godot_game_v10.zip -O /tmp/v10.zip
            unzip -q -o /tmp/v10.zip "assets/*" "icon.png" "icon.png.import" || true
            rm -f /tmp/v10.zip
            echo "Assets restored successfully."
          else
            echo "Assets directory already present."
          fi
          mkdir -p build

      - name: Export Android APK
        run: |
          godot --headless --export-debug "Android" build/selim.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: selim-game-apk
          path: build/selim.apk
          retention-days: 30
