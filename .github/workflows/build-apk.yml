name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK (Godot 4.3)
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Godot Home and Templates
        run: |
          mkdir -p "$HOME/.local/share" "$HOME/.config"
          if [ -d "/root/.local/share/godot" ]; then
            cp -rn /root/.local/share/godot "$HOME/.local/share/"
          fi
          if [ -d "/root/.config/godot" ]; then
            cp -rn /root/.config/godot "$HOME/.config/"
          fi

      - name: Restore game assets (keep committed overrides)
        run: |
          echo "Downloading v10.0.0 assets package..."
          wget -q -L https://github.com/noorapp10000-web/selim-godot-game/releases/download/v10.0.0/selim_godot_game_v10.zip -O /tmp/v10.zip
          # -n: never overwrite files already committed to the repo (new icon, new voice clip)
          unzip -q -n /tmp/v10.zip "assets/*" "icon.png" "icon.png.import" || true
          rm -f /tmp/v10.zip
          mkdir -p build

      - name: Export Android APK
        run: |
          godot --headless --export-debug "Android" build/selim.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: selim-game-apk
          path: build/selim.apk
          retention-days: 30
